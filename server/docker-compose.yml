version: '3.8'

services:
  api:
    image: sumitup-app:latest
    container_name: sumitup-backend
    restart: always
    env_file:
      - .env
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    container_name: sumitup-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api